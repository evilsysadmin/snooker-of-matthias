name: Snooker 3D POC · test and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: snooker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund
      - name: Deterministic physics tests
        run: npm test
      - name: Production 3D build
        env:
          # On main push this is the same SHA admitted by ShadowOps Infra.
          # A PR artifact is never admitted for staging publication.
          VITE_SOURCE_SHA: ${{ github.sha }}
        run: npm run build
      - name: Verify build identifies its exact source commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const sha = process.env.SOURCE_SHA;
            assert.match(sha, /^[a-f0-9]{40}$/);
            const files = fs.readdirSync("dist/assets").filter(x => x.endsWith(".js"));
            assert.ok(files.some(name => fs.readFileSync("dist/assets/" + name, "utf8").includes(sha)),
              "Published JS bundle does not identify the exact source commit");
          '
      # ubuntu-24.04 hosted runners already provide Chromium's shared libs.
      # Avoid apt --with-deps, which depends on an extra Ubuntu mirror DNS
      # (and blocked otherwise green CI on 2026-11-11).
      - name: Install Chromium for a real WebGL smoke
        run: npx playwright install chromium
      - name: Exercise desktop and mobile 3D browser
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/snooker-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snooker-desktop-mobile
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Attach Cloudflare Pages-ready dist (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: snooker-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

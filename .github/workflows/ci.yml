name: Snooker 3D POC · test and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Retain CI and source-bound build artifacts for every main commit.
  # Superseded revisions of one PR may still cancel each other.
  group: snooker-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install immutable npm dependency graph
        run: npm ci --no-fund
      - name: Reject high or critical npm advisories
        run: npm audit --audit-level=high
      - name: Deterministic physics tests
        run: npm test
      - name: Production 3D build
        env:
          # On main push this is the same SHA admitted by ShadowOps Infra.
          # A PR artifact is never admitted for staging publication.
          VITE_SOURCE_SHA: ${{ github.sha }}
        run: npm run build
      - name: Report JavaScript and CSS gzip size (informational)
        # Baseline at Vite 8.3.8: JS 192.01 kB gzip (issue #71).
        # Keep security and WebGL checks blocking; budget warning is not.
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const dir = 'dist/assets';
          const assets = fs.readdirSync(dir).filter(name => /\.(?:js|css)$/.test(name));
          if (!assets.some(name => name.endsWith('.js'))) {
            throw new Error('No bundled JavaScript to measure');
          }
          const bytes = { js: 0, css: 0 };
          for (const name of assets) {
            const type = name.endsWith('.js') ? 'js' : 'css';
            bytes[type] += zlib.gzipSync(fs.readFileSync(dir + '/' + name)).length;
          }
          const kib = value => (value / 1024).toFixed(2);
          console.log('SNOOKER_GZIP_BUNDLE js_kib=' + kib(bytes.js)
            + ' css_kib=' + kib(bytes.css) + ' chunks=' + assets.length);
          if (bytes.js > 200 * 1024) {
            console.log('::warning::JavaScript gzip assets exceed the 200 KiB soft budget; review issue #71');
          }
          NODE
      - name: Verify build identifies its exact source commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const sha = process.env.SOURCE_SHA;
            assert.match(sha, /^[a-f0-9]{40}$/);
            const files = fs.readdirSync("dist/assets").filter(x => x.endsWith(".js"));
            assert.ok(files.some(name => fs.readFileSync("dist/assets/" + name, "utf8").includes(sha)),
              "Published JS bundle does not identify the exact source commit");
          '
      # ubuntu-24.04 hosted runners already provide Chromium's shared libs.
      # Avoid apt --with-deps, which depends on an extra Ubuntu mirror DNS
      # (and blocked otherwise green CI on 2026-11-11).
      # Playwright is pinned to 1.56.1 in package.json; cache its exact browser.
      # Retain `install` to recover from cache misses without skipping WebGL QA.
      - name: Restore pinned Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: snooker-chromium-${{ runner.os }}-${{ runner.arch }}-playwright-1.56.1
      - name: Install Chromium for a real WebGL smoke
        run: npx playwright install chromium
      - name: Exercise desktop and mobile 3D browser
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/snooker-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke
      # Preserve visual QA on PRs and diagnostics on failures, without
      # uploading redundant PNGs from healthy main releases.
      - name: Upload browser screenshots
        if: ${{ always() && (github.event_name == 'pull_request' || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: snooker-desktop-mobile
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Attach Cloudflare Pages-ready dist (not a deployment)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: snooker-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
